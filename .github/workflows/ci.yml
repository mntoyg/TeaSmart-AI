name: CI

# 166 Python tests and 47 frontend tests existed for a week with nothing running
# them on a push. This is that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run it interrupted. Nobody reads the old one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.9.4
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Test
        working-directory: backend
        run: pytest -q

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install
        working-directory: ml
        # The CPU wheel, deliberately: requirements.txt pins the CUDA build for
        # the training machine, and every test in this package runs on the CPU.
        # The CUDA download is 2.5 GB and would buy nothing here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.9.4 \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        working-directory: ml
        run: ruff check teasmart_ml tests
      - name: Lint scripts
        # scripts/ belongs to no package, so neither pyproject lints it. Done
        # in this job because it is the one with ruff and a checkout of both.
        run: ruff check scripts --line-length 100
      - name: Test
        working-directory: ml
        # No -n auto: the parity fixtures resize a 3120x4160 image and the
        # training smoke test fits a real network. Both are memory-hungry.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is there a frontend in this branch?
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json on this ref; nothing to do."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Types
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm test
      - name: Build
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
